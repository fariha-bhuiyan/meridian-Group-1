name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the app loads
        run: node -e "require('./src/app.js')"
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci --reporters=default --reporters=github-actions
      - name: Check dependencies
        run: npm audit --audit-level=high