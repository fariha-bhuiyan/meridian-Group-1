name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the app loads
        run: node -e "require('./src/app.js')"
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci --reporters=default --reporters=github-actions